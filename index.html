 <main class="viewport" id="viewport" aria-label="Your generated world">
  <div class="canvas-wrap" id="canvasWrap"><canvas id="worldCanvas" tabindex="0" role="img" aria-label="Generated pixel art meadow ruins. Drag to move, arrow keys to pan, plus and minus to zoom."></canvas><div class="capture-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>

  </section>

   <div class="section-divider"></div><div class="field-label">Pixels</div><div class="segmented pixel-buttons" role="group" aria-label="Pixel finish"><button data-pixels="fine" class="active" aria-pressed="true">Fine</button><button data-pixels="none" aria-pressed="false">No pixelation</button><button data-pixels="classic" aria-pressed="false">Classic</button></div>

  </section>
