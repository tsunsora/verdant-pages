<body>
 <main class="viewport" id="viewport" aria-label="Your generated world">
  <div class="canvas-wrap" id="canvasWrap"><canvas id="worldCanvas" tabindex="0" role="img" aria-label="Generated pixel art meadow ruins. Drag to move, arrow keys to pan, plus and minus to zoom."></canvas><div class="capture-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  <div class="loading hidden" id="loading" role="status"><span class="loading-symbol" aria-hidden="true">✦</span><span>Generating…</span></div>
  <div id="error" class="error" role="alert" hidden></div>
 </main>
 <header class="topbar hud">
  <div class="brand" role="img" aria-label="Verdant"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6h8v6h8V6h8v9h-7v6h-5v7h-4v-7H7v-6H4z"/></svg></div>
  <div class="top-actions"><button class="hud-button" data-panel="help" aria-label="Controls" aria-controls="menuPanel" aria-expanded="false" title="Controls (?)"><span data-icon="help"></span></button><button class="hud-button" id="focus" aria-label="Hide interface" aria-pressed="false" title="Hide interface (V)"><span data-icon="expand"></span></button></div>
 </header>
 <button id="leaveFocus" class="hud-button leave-focus" aria-label="Show interface" title="Show interface (V)"><span data-icon="collapse"></span></button>
 <section class="world-caption hud" aria-label="Current world">
  <h1 id="sceneName">Meadow ruins</h1>
 </section>
 <aside id="menuPanel" class="menu-panel" role="dialog" aria-labelledby="panelTitle" aria-hidden="true" inert>
  <div class="panel-heading"><h2 id="panelTitle">Biomes</h2><button id="closePanel" class="icon-button" aria-label="Close panel" title="Close (Esc)"><span data-icon="close"></span></button></div>
  <section class="panel-view biome-panel" data-view="biomes" hidden>
   <div class="atlas-filters"><label class="search-wrap"><span data-icon="search"></span><input type="search" id="biomeSearch" name="biome-search" placeholder="Search biomes…" aria-label="Search biomes" autocomplete="off"></label><label class="select-wrap"><span class="sr-only">Biome family</span><select id="biomeFamily" name="biome-family"></select><span data-icon="chevron"></span></label></div>
   <div id="biomeList" class="biome-list" role="group" aria-label="Biomes"></div>
   <div class="atlas-bottom"><label for="area" class="field-label">Landmark</label><div class="landmark-row"><div class="select-wrap"><select id="area" name="landmark"></select><span data-icon="chevron"></span></div><button class="icon-button" id="surprise" aria-label="Random biome and seed" title="Random biome and seed"><span data-icon="shuffle"></span></button></div></div>
  </section>
  <section class="panel-view light-panel" data-view="light" hidden>
   <div class="segmented lighting" role="group" aria-label="Lighting"><button data-light="day" class="active" aria-pressed="true"><span data-icon="sun"></span><span>Day</span></button><button data-light="gold" aria-pressed="false"><span data-icon="sunset"></span><span>Golden</span></button><button data-light="night" aria-pressed="false"><span data-icon="moon"></span><span>Night</span></button></div>
   <div class="range-label"><label for="density">Vegetation</label><output id="densityValue" for="density">64%</output></div><input id="density" name="vegetation" type="range" min="15" max="90" value="64">
   <div class="range-label"><label for="mist">Haze</label><output id="mistValue" for="mist">24%</output></div><input id="mist" name="haze" type="range" min="0" max="100" value="24">
   <label class="toggle-row" for="motion"><span>Animation</span><input type="checkbox" name="animation" id="motion" checked><span class="switch" aria-hidden="true"></span></label>
   <div class="section-divider"></div><div class="field-label">Pixels</div><div class="segmented pixel-buttons" role="group" aria-label="Pixel finish"><button data-pixels="fine" aria-pressed="false">Fine</button><button data-pixels="classic" class="active" aria-pressed="true">Classic</button><button data-pixels="bold" aria-pressed="false">Bold</button></div>
   <label class="field-label seed-label" for="seed">Seed</label><div class="seed-input"><span data-icon="seed"></span><input id="seed" name="world-seed" value="mosslight-042" maxlength="80" autocomplete="off" spellcheck="false"><button id="applySeed" class="icon-button" title="Apply seed" aria-label="Apply seed"><span data-icon="check"></span></button></div>
  </section>
  <section class="panel-view camera-panel" data-view="camera" hidden>
   <label class="field-label" for="worldSize">World size</label><div class="select-wrap world-size"><select id="worldSize" name="world-size"><option value="large">Spacious</option><option value="vast">Vast</option></select><span data-icon="chevron"></span></div>
   <label class="field-label" for="destination">Destination</label><div class="destination-row"><button id="previousPlace" class="icon-button" aria-label="Previous place" title="Previous place"><span data-icon="arrowLeft"></span></button><div class="select-wrap"><select id="destination" name="destination"></select><span data-icon="chevron"></span></div><button id="nextPlace" class="icon-button" aria-label="Next place" title="Next place"><span data-icon="arrowRight"></span></button></div>
   <div class="view-presets"><button id="wideView" class="subtle-button"><span data-icon="wallpaper"></span>Wide</button><button id="overview" class="subtle-button"><span data-icon="map"></span>Overview</button></div><div class="camera-tools" aria-label="Camera controls"><button id="rotateLeft" class="icon-button" aria-label="Rotate camera left" title="Rotate left"><span data-icon="rotateLeft"></span></button><button id="rotateRight" class="icon-button" aria-label="Rotate camera right" title="Rotate right"><span data-icon="rotateRight"></span></button><span class="tool-divider"></span><button id="zoomOut" class="icon-button" aria-label="Zoom out" title="Zoom out"><span data-icon="minus"></span></button><span id="zoomLabel" aria-label="Zoom">110%</span><button id="zoomIn" class="icon-button" aria-label="Zoom in" title="Zoom in"><span data-icon="plus"></span></button></div>
   <button id="resetCamera" class="subtle-button"><span data-icon="reset"></span>Reset view</button>
  </section>
